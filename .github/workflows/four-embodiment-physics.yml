name: four-embodiment-physics

on:
  push:
    branches: [main]
  pull_request:

jobs:
  four-embodiment-physics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Vector-Wangel/XLeRobot
          ref: 3d14695e40c9c68229c0aacffca6053c75cd3eb6
          path: .vendor/XLeRobot
      - uses: actions/checkout@v4
        with:
          repository: huggingface/lerobot-humanoid-runtime
          ref: e4dc62795e83b2e69580cad4d3229bdb558e912e
          path: .vendor/lerobot-humanoid-runtime
      - uses: actions/checkout@v4
        with:
          repository: huggingface/lerobot-humanoid-model
          ref: 222717c3faeef21709a578a088c267c8a5f4a4a9
          path: .vendor/lerobot-humanoid-runtime/robot/lerobot-humanoid-model
      - uses: actions/checkout@v4
        with:
          repository: pollen-robotics/microduck_rl
          ref: d424a0c899f6b33cbd3daeb279913134349c0b63
          path: .vendor/microduck_rl
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - name: Install all simulator and MCP runtimes
        run: |
          pip install "numpy>=2.5" "scipy>=1.18" "pillow>=12.3" "pybullet>=3.2.7" "gymnasium>=1.3" "transforms3d>=0.4"
          pip install --no-deps "gym-pybullet-drones @ git+https://github.com/learnsyslab/gym-pybullet-drones.git@24fccff4da746badb6eaa9f5055cd5d9b6613160"
          pip install -e ".[xlerobot-sim,humanoid-sim,microduck-sim,mcp]"
      - name: Download pinned Microduck policies
        run: |
          mkdir -p .vendor/microduck-policies
          base="https://huggingface.co/spaces/pollen-robotics/microduck-simulator/resolve/836975ab63058b2235fe23878bb86a3e2eee7089/app/public/policies"
          for policy in \
            BEST_alpha_walking.onnx \
            BEST_alpha_stand.onnx \
            roulade.onnx
          do
            curl -L --fail --retry 3 --retry-all-errors \
              -o ".vendor/microduck-policies/$policy" \
              "$base/$policy?download=true"
          done
      - name: Run all-four real-simulator AgentModel gate
        env:
          PYBULLET_EGL: "0"
          XLEROBOT_UPSTREAM_ROOT: ${{ github.workspace }}/.vendor/XLeRobot
          LEROBOT_HUMANOID_RUNTIME_ROOT: ${{ github.workspace }}/.vendor/lerobot-humanoid-runtime
          MICRODUCK_RL_ROOT: ${{ github.workspace }}/.vendor/microduck_rl
          MICRODUCK_POLICY_DIR: ${{ github.workspace }}/.vendor/microduck-policies
        run: python -m unittest discover -s integration_tests -p "test_four_embodiment_physics.py" -v
