name: unitree-g1-physics

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unitree-g1-envhub-physics:
    runs-on: ubuntu-latest
    env:
      MUJOCO_GL: osmesa
      PYOPENGL_PLATFORM: osmesa
      SDL_VIDEODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: unitreerobotics/unitree_sdk2_python
          ref: 65691c8a8bc53b98d3976dba4dbf9d5d20b2e7f5
          path: .vendor/unitree-sdk2-python
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install OSMesa software rendering runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libosmesa6-dev
      - name: Install pinned G1 EnvHub runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "cyclonedds==0.10.2" \
            "mujoco>=3,<4" \
            "numpy>=1.24,<2.3" \
            "pyyaml>=6,<7" \
            "gymnasium>=1.1,<2" \
            "huggingface-hub>=1.6,<2" \
            "loguru>=0.7,<1" \
            "opencv-python-headless>=4.8,<4.14" \
            "pyzmq>=25,<28" \
            "msgpack>=1,<2" \
            "msgpack-numpy>=0.4.8,<1" \
            "matplotlib>=3.5,<4" \
            "scipy>=1.10,<2" \
            "termcolor>=2.4,<4" \
            "pygame>=2.5,<2.7"
          python -m pip install -e .vendor/unitree-sdk2-python
          python - <<'PY'
          import unitree_sdk2py
          from unitree_sdk2py.core.channel import ChannelFactoryInitialize
          print("unitree_sdk2py source import OK", ChannelFactoryInitialize)
          PY
      - name: Check out pinned Unitree G1 EnvHub repository
        run: |
          git clone https://huggingface.co/lerobot/unitree-g1-mujoco .vendor/unitree-g1-mujoco
          git -C .vendor/unitree-g1-mujoco checkout a38dc8617f0fca51b38e9354dc58ee35ad850fb5
          git -C .vendor/unitree-g1-mujoco lfs pull
          git -C .vendor/unitree-g1-mujoco rev-parse HEAD
      - name: Run headless MuJoCo reset and physics-step smoke
        env:
          UNITREE_G1_ENV_ROOT: ${{ github.workspace }}/.vendor/unitree-g1-mujoco
        run: python -m unittest discover -s integration_tests -p "test_unitree_g1_envhub_physics.py" -v
