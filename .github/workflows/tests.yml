name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python -m unittest discover -s tests -v

  crazyflie-physics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - name: Install minimal VelocityAviary runtime
        run: |
          pip install "numpy>=2.5" "scipy>=1.18" "pillow>=12.3" "pybullet>=3.2.7" "gymnasium>=1.3"
          pip install --no-deps "gym-pybullet-drones @ git+https://github.com/learnsyslab/gym-pybullet-drones.git@24fccff4da746badb6eaa9f5055cd5d9b6613160"
          pip install -e .
      - name: Run headless Crazyflie PyBullet integration smoke
        env:
          PYBULLET_EGL: "0"
        run: python -m unittest discover -s integration_tests -p "test_crazyflie_physics.py" -v
