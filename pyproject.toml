[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "embodied-agent"
version = "0.1.0"
description = "Simulation-first multi-embodiment agent platform for XLeRobot, Crazyflie, and LeRobot Humanoid"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
embodied-agent-mcp = "embodied_agent.mcp.__main__:main"
embodied-agent-run = "embodied_agent.mcp.openai_cli:main"

[project.optional-dependencies]
crazyflie-sim = ["gym-pybullet-drones>=2.2,<3"]
humanoid-sim = ["mujoco>=3,<4", "numpy>=2.0"]
xlerobot-sim = ["mujoco>=3,<4", "numpy>=2.0"]
mcp = ["mcp>=2,<3"]
openai-agent = ["mcp>=2,<3", "openai>=3,<4"]
dev = ["numpy>=2.0", "mcp>=2,<3", "openai>=3,<4"]

[tool.setuptools.packages.find]
include = ["embodied_agent*"]
