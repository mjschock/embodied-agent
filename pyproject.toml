[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "embodied-agent"
version = "0.1.0"
description = "Simulation-first multi-embodiment agent platform for XLeRobot, Crazyflie, Microduck, LeRobot Humanoid, SO-101, and Unitree G1"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
embodied-agent-mcp = "embodied_agent.mcp.__main__:main"
embodied-agent-run = "embodied_agent.mcp.openai_cli:main"
embodied-agent-eval-openai = "embodied_agent.evals.openai_agent:main"
embodied-agent-eval-openai-four = "embodied_agent.evals.openai_four_embodiment:main"
embodied-agent-eval-openai-physics = "embodied_agent.evals.openai_physics_agent:main"

[project.optional-dependencies]
crazyflie-sim = [
  "gym-pybullet-drones @ git+https://github.com/learnsyslab/gym-pybullet-drones.git@24fccff4da746badb6eaa9f5055cd5d9b6613160"
]
humanoid-sim = ["mujoco>=3,<4", "numpy>=2.0"]
microduck-sim = ["mujoco>=3,<4", "numpy>=2.0", "onnxruntime>=1.24.4,<2"]
xlerobot-sim = ["mujoco>=3,<4", "numpy>=2.0"]
so101 = ["lerobot[feetech]>=0.6.1,<0.7"]
unitree-g1 = ["lerobot[unitree_g1]>=0.6.1,<0.7"]
mcp = ["mcp>=2,<3"]
openai-agent = ["mcp>=2,<3", "openai>=3,<4"]
dev = ["numpy>=2.0", "mcp>=2,<3", "openai>=3,<4"]

[tool.setuptools.packages.find]
include = ["embodied_agent*"]
