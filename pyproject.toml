[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "embodied-agent"
version = "0.1.0"
description = "Simulation-first multi-embodiment agent platform for XLeRobot, Crazyflie, and LeRobot Humanoid"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = []

[tool.setuptools.packages.find]
include = ["embodied_agent*"]
